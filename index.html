<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Funding Rate Tracker</title>

<!-- PWA manifest -->
<link rel="manifest" href="manifest.json">

<!-- iOS "Add to Home Screen" support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Funding">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#12121c">

<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="row">
    <h1>Funding Rates</h1>
    <span id="wsStatus" class="val warn">CONNECTING...</span>
  </div>
  <div class="row">
    <input type="text" id="filterInput" placeholder="Filter pairs (e.g. BTC)..." autocomplete="off">
    <span id="pairCount" class="muted">-</span>
  </div>
</header>

<main>
  <div class="table-wrap">
    <table id="fundingTable">
      <thead>
        <tr>
          <th data-col="symbol" class="sortable">Pair<span class="sort-arrow"></span></th>
          <th data-col="fundingRate" class="sortable">Funding Rate<span class="sort-arrow"></span></th>
          <th data-col="nextFundingTime">Next Funding</th>
          <th data-col="timeLeft" class="sortable">Time Left<span class="sort-arrow"></span></th>
        </tr>
      </thead>
      <tbody id="fundingBody"></tbody>
    </table>
  </div>
</main>

<footer class="footer muted">
  Live funding rate data streamed directly from your device to Binance's public USDS-M Futures market data - nothing is sent anywhere else. Tap a column header to sort.
</footer>

<script src="app.js"></script>
</body>
</html>
